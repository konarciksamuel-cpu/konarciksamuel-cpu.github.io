<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samuel Konarčík: plagáty</title>
<meta name="description" content="Plagáty a návrhy Samuela Konarčíka, UI/UX dizajnéra v PredPo.">
<meta name="color-scheme" content="light">
<style>
:root{--paper:#fff;--ink:#141414;--muted:#595959}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--paper);color:var(--ink);font:600 1rem/1.4 ui-sans-serif,system-ui,sans-serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
main{display:grid;gap:clamp(4rem,14vh,10rem);padding:1rem 1rem clamp(4rem,14vh,10rem)}
figure{width:min(100%,46rem,calc((100svh - 2rem) * var(--ar,1)));margin-inline:auto}
figure.wide{width:min(100%,72rem)}
img{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:no-preference){
  @supports (animation-timeline:view()){
    figure:not(:first-child){animation:in linear both;animation-timeline:view();animation-range:entry 0% entry 60%}
  }
}
@keyframes in{from{opacity:0}to{opacity:1}}
footer{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.5rem 1rem;font-size:.875rem;color:var(--muted)}
a{color:inherit;text-underline-offset:.2em}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<h1 class="sr">Samuel Konarčík: plagáty</h1>
<main>
  <figure style="--ar:0.646">
    <img src="img/dragon-eye.webp" width="1600" height="2477" fetchpriority="high" decoding="async" alt="Plagát Dragon Eye: japonský nadpis, ryba s veľkým okom a plutva v hrubej mriežke, zelené a hrdzavé pozadie.">
    <figcaption class="sr">Dragon Eye</figcaption>
  </figure>
  <figure style="--ar:0.707">
    <img src="img/a-taste-u-cant-forget.webp" width="1188" height="1680" loading="lazy" decoding="async" alt="Plagát A taste u cant forget: veľký krémový nadpis na tmavozelenom pozadí a rozostrená fotka hrušiek.">
    <figcaption class="sr">A taste u cant forget</figcaption>
  </figure>
  <figure class="wide">
    <img src="img/landing-satka.webp" width="1440" height="900" loading="lazy" decoding="async" alt="Návrh úvodnej stránky PredPo: obrovský nadpis „weby pre lokálne firmy“ vľavo, za ním fotka tmavej šatky, vpravo štyri hrubé čiary.">
    <figcaption class="sr">Landing so šatkou pre PredPo</figcaption>
  </figure>
</main>
<footer>
  <span>Samuel Konarčík</span>
  <a href="https://predpo.dev">predpo.dev</a>
</footer>
</body>
</html>
